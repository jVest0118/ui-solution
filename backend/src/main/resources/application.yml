spring:
  # ─────────────────────────────────────────
  # DB 설정 - MySQL 8.4
  # ─────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/uisolution?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: uisolution
    password: uisolution123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    context-path: /api

platform:
  jwt:
    secret: ui-solution-platform-jwt-secret-key-must-be-256-bits-long-for-hs256
    expiration: 86400000
    refresh-expiration: 604800000
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

logging:
  level:
    com.uisolution: DEBUG
    org.springframework.security: INFO
