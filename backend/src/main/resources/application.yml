spring:
  # ─────────────────────────────────────────
  # DB 설정 - 현재: H2 파일 모드 (설치 불필요)
  # PostgreSQL 전환 시 아래 주석 참고
  # ─────────────────────────────────────────
  datasource:
    url: jdbc:h2:file:./data/uisolution;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # PostgreSQL 전환 시 위 datasource 블록을 아래로 교체:
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/uisolution
  #   username: uisolution
  #   password: uisolution123
  #   driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: true          # http://localhost:8080/api/h2-console 에서 DB 확인 가능
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    # PostgreSQL 전환 시 dialect 를 아래로 교체:
    # dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    context-path: /api

platform:
  jwt:
    secret: ui-solution-platform-jwt-secret-key-must-be-256-bits-long-for-hs256
    expiration: 86400000
    refresh-expiration: 604800000
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

logging:
  level:
    com.uisolution: DEBUG
    org.springframework.security: INFO
